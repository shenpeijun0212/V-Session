[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vsession"
version = "0.2.0"
description = "Research utilities for V-Session structured mathematical reasoning"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
  {name = "Peijun Shen"},
  {name = "Si Shen"},
  {name = "Danhao Zhu"},
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "sympy>=1.12,<2",
]

[project.optional-dependencies]
hf = [
  "torch>=2.2",
  "transformers>=4.48,<5",
  "accelerate>=1.0",
]
vllm = [
  "vllm>=0.8",
]
data = [
  "datasets>=3.0",
]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
vsession = "vsession.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
